<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encurtador de URL</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Encurtador de URL</h1>
      <form id="shorten-form">
        <label for="url-input">URL original</label>
        <input
          id="url-input"
          name="url"
          type="url"
          required
          placeholder="https://exemplo.com/pagina"
          maxlength="2048"
        />
        <div id="captcha-widget"></div>
        <p id="captcha-note" class="note" hidden>
          Captcha desativado (sem chave configurada — modo dev).
        </p>
        <button type="submit" id="submit-btn">Encurtar</button>
      </form>
      <p id="error-msg" class="error" hidden></p>
      <div id="result" hidden>
        <span>Sua URL:</span>
        <a id="short-link" href="#" target="_blank" rel="noopener"></a>
      </div>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
