services:
  url_shortener:
    build: .
    ports:
      - "8000:8000"
    # Credenciais (DB_USER/DB_PASSWORD/DB_NAME) vêm de src/.env (gitignored).
    # DB_HOST/DB_PORT ficam em environment (valores de container) pois têm
    # precedência sobre o env_file — o app monta a URI a partir das partes
    # (sem DATABASE_URL fixa, que congelaria credenciais erradas).
    env_file:
      - src/.env
    environment:
      # PG 18 nativo do WSL (cluster 18/main, porta 5432).
      # Do container, o WSL é o gateway da bridge docker0 —
      # host-gateway resolve para 172.17.0.1 de forma estável.
      # FLASK_ENV=production: sem isso o container roda DevelopmentConfig (DEBUG).
      FLASK_ENV: production
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      # Site key é pública; secret vem só do env_file (nunca commitar default)
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-0x4AAAAAAEnrWN-FcfhIDg-J}
    extra_hosts:
      - "host.docker.internal:host-gateway"
